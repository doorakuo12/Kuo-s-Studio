    <!-- JavaScript 互動功能 -->
    <script>
        // A. 筆記本翻頁功能
        const bookPages = [
        { src: "images/japan-1.JPG", caption: "和老爸搞怪" },
        { src: "images/japan-2.JPG", caption: "吃吃吃一堆" },
        { src: "images/japan-3.JPG", caption: "local市集挖寶趣" },
        { src: "images/japan-4.JPG", caption: "偶ㄉ包包裡有..." },
        { src: "images/japan-5.JPG", caption: "最愛看動物行程" },
        { src: "images/japan-6.JPG", caption: "飛機餐lover" },
        { src: "images/japan-7.JPG", caption: "繽紛壽司店" },
        { src: "images/japan-8.JPG", caption: "熊本有名の炸豬排" }
    ];

        let currentPage = 0;
        const leftImage = document.getElementById("leftPageImage");
        const rightImage = document.getElementById("rightPageImage");
        const leftCaption = document.getElementById("leftPageCaption");
        const rightCaption = document.getElementById("rightPageCaption");
        const pageNumber = document.getElementById("bookPageNumber");
        const bookSpread = document.getElementById("notebookSpread");
        const prevButton = document.getElementById("bookPrev");
        const nextButton = document.getElementById("bookNext");

        function renderBook() {
            const totalPages = bookPages.length;
            const left = bookPages[currentPage];
            const rightIndex = (currentPage + 1) % totalPages;
            const right = bookPages[rightIndex];

            leftImage.src = left.src;
            leftImage.alt = left.caption;
            leftCaption.textContent = left.caption;

            rightImage.src = right.src;
            rightImage.alt = right.caption;
            rightCaption.textContent = right.caption;

            const start = String(currentPage + 1).padStart(2, "0");
            const end = String(rightIndex + 1).padStart(2, "0");
            const total = String(totalPages).padStart(2, "0");

            pageNumber.textContent = `${start}–${end} / ${total}`;
        }

        function turnBook(direction) {
            const totalPages = bookPages.length;
            bookSpread.classList.remove("turn-next", "turn-prev");
            void bookSpread.offsetWidth; // Trigger reflow

            if (direction === "next") {
                currentPage = (currentPage + 2) % totalPages;
                bookSpread.classList.add("turn-next");
            } else {
                // 修復了原本錯誤的數學運算式
                currentPage = (currentPage - 2 + totalPages) % totalPages;
                bookSpread.classList.add("turn-prev");
            }

            renderBook();
            setTimeout(() => {
                bookSpread.classList.remove("turn-next", "turn-prev");
            }, 600);
        }

        prevButton.addEventListener("click", () => turnBook("prev"));
        nextButton.addEventListener("click", () => turnBook("next"));

        renderBook();
    </script>
